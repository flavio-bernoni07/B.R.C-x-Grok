<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Case curve: the share of cases a person decided falls from 80% to 16% over 6 weeks as rules are learned" font-family="IBM Plex Sans, system-ui, sans-serif"><rect width="640" height="320" fill="#ffffff"/><text x="56" y="22" font-size="14" font-weight="600" fill="#18201c">Case curve (average of 20 replays of 60 invented claims, scripted Grok and person)</text><line x1="56" x2="600" y1="272.0" y2="272.0" stroke="#d9ddd9"/><text x="48" y="276.0" font-size="11" text-anchor="end" fill="#5b665f">0%</text><line x1="56" x2="600" y1="213.0" y2="213.0" stroke="#d9ddd9"/><text x="48" y="217.0" font-size="11" text-anchor="end" fill="#5b665f">25%</text><line x1="56" x2="600" y1="154.0" y2="154.0" stroke="#d9ddd9"/><text x="48" y="158.0" font-size="11" text-anchor="end" fill="#5b665f">50%</text><line x1="56" x2="600" y1="95.0" y2="95.0" stroke="#d9ddd9"/><text x="48" y="99.0" font-size="11" text-anchor="end" fill="#5b665f">75%</text><line x1="56" x2="600" y1="36.0" y2="36.0" stroke="#d9ddd9"/><text x="48" y="40.0" font-size="11" text-anchor="end" fill="#5b665f">100%</text><text x="56.0" y="290" font-size="11" text-anchor="middle" fill="#5b665f">week 1</text><text x="164.8" y="290" font-size="11" text-anchor="middle" fill="#5b665f">week 2</text><text x="273.6" y="290" font-size="11" text-anchor="middle" fill="#5b665f">week 3</text><text x="382.4" y="290" font-size="11" text-anchor="middle" fill="#5b665f">week 4</text><text x="491.2" y="290" font-size="11" text-anchor="middle" fill="#5b665f">week 5</text><text x="600.0" y="290" font-size="11" text-anchor="middle" fill="#5b665f">week 6</text><polyline points="56.0,84.4 164.8,196.5 273.6,221.3 382.4,235.4 491.2,221.3 600.0,234.2" fill="none" stroke="#a96300" stroke-width="2.5"/><circle cx="56.0" cy="84.4" r="3.5" fill="#a96300"/><circle cx="164.8" cy="196.5" r="3.5" fill="#a96300"/><circle cx="273.6" cy="221.3" r="3.5" fill="#a96300"/><circle cx="382.