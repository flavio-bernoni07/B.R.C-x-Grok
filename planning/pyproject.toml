[project]
name = "rice-forecast"
version = "0.1.0"
description = "Paddy price data, Prophet baseline and backtest for the Rice Agent"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "prophet>=1.1.6,<2",
  "requests>=2.32,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rice_forecast"]
