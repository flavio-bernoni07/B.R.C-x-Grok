[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brc-x-grok"
version = "0.1.0"
description = "Riso Scotti zero-touch back office (Grok Hackathon Pavia 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["a38>=0.1.8,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.setuptools.packages.find]
include = ["dispute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
